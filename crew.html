<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>清潔隊｜滿溢告警｜有桶</title><link rel="stylesheet" href="vendor/leaflet/leaflet.css"><link rel="stylesheet" href="common.css"></head>
<body><div class="app"><header></header><main>
<div id="map"></div>
<aside class="panel"><button class="handle" aria-label="展開面板"></button>
 <h2>模擬滿溢告警</h2><p class="sub">台北目前沒有垃圾桶滿溢偵測資料，以下填充度為<b>模擬值</b>（依桶編號固定產生），行人「滿了」回報會即時加入。</p>
 <select id="dist"></select>
 <div class="row" style="margin:12px 0"><span class="sub" style="margin:0;flex:1" id="cnt"></span><button class="btn sm pri" id="all">一鍵回報已清運</button></div>
 <div id="alerts"></div>
 <h3>回報紀錄</h3><div id="hist" class="sub">尚無紀錄</div>
 <div class="row" style="margin-top:8px"><button class="btn sm" id="reset">清除示範資料</button><a class="btn sm" id="routeLink" href="crew-route.html" hidden>動態清運路線（實驗）</a></div>
</aside></main></div>
<script src="vendor/leaflet/leaflet.js"></script><script src="config.js"></script><script src="common.js"></script>
<script>
nav('crew.html');sheet();
const map=baseMap(CONFIG.demoArea.center,15),L1=L.layerGroup().addTo(map),TH=80;
if(CONFIG.features.crewRouting||new URLSearchParams(location.search).get('route')==='1')routeLink.hidden=false;
let bins=[];
const inD=()=>bins.filter(b=>b.d===dist.value);
function show(){const ev=getEvents();L1.clearLayers();
  const list=inD().map(b=>({...b,f:fillOf(b.id,ev),rep:ev.filter(e=>e.bin===b.id&&e.kind==='full').length&&ev.filter(e=>e.bin===b.id).slice(-1)[0].kind==='full'})).sort((a,b)=>b.f-a.f);
  for(const b of list)L.circleMarker([b.la,b.lo],{radius:b.f>=TH?8:5,color:'#fff',weight:1.5,fillColor:fillColor(b.f),fillOpacity:.95}).bindPopup(`${b.addr}<br>填充度 ${b.f}%（模擬）`).addTo(L1);
  const al=list.filter(b=>b.f>=TH);cnt.textContent=`${inD().length} 個桶・${al.length} 個告警（≥${TH}%）`;all.disabled=!al.length;
  alerts.innerHTML=al.map(b=>`<div class="card"><div class="row" style="flex-wrap:nowrap"><div style="flex:1"><div class="t" style="font-weight:600">${b.addr}</div><div class="sub" style="margin:4px 0 0">${fillPill(b.f)} ${b.rep?'<span class="pill full">行人回報滿了</span>':'<span style="font-size:11px">模擬</span>'}</div></div><button class="btn sm pri" data-c="${b.id}">已清運</button></div></div>`).join('')||'<p class="sub">目前沒有告警 🎉</p>';
  const ids=new Set(inD().map(b=>b.id)),h=getEvents().filter(e=>ids.has(e.bin)).reverse().slice(0,20);
  hist.innerHTML=h.length?h.map(e=>{const b=bins.find(x=>x.id===e.bin);return `<div style="padding:6px 0;border-bottom:1px solid var(--line)">${timeStr(e.ts)}・<b>${e.by}</b> ${e.kind==='full'?'回報已滿':e.kind==='clear'?'已清運':'回報 '+e.level+'%'}<br>${b?b.addr:e.bin}</div>`}).join(''):'尚無紀錄'}
alerts.onclick=e=>{const c=e.target.closest('[data-c]');if(c){addEvent({bin:c.dataset.c,kind:'clear',level:0,by:'清潔隊'});toast('已回報清運');show()}};
all.onclick=()=>{const ev=getEvents();const al=inD().filter(b=>fillOf(b.id,ev)>=TH);al.forEach(b=>addEvent({bin:b.id,kind:'clear',level:0,by:'清潔隊'}));toast(`已回報 ${al.length} 個桶清運完成`);show()};
dist.onchange=()=>{localStorage.setItem('debug松_crew_dist',dist.value);const b=inD();if(b.length)map.fitBounds(b.map(x=>[x.la,x.lo]),{padding:[30,30]});show()};
reset.onclick=()=>{if(confirm('清除所有示範回報？')){localStorage.removeItem(LS_EVENTS);show();toast('已清除')}};
loadCore().then(D=>{bins=D.street;const c={};bins.forEach(b=>c[b.d]=(c[b.d]||0)+1);
  dist.innerHTML=Object.keys(c).sort((a,b)=>c[b]-c[a]).map(n=>`<option value="${n}">${n}（${c[n]} 個）</option>`).join('');
  dist.value=localStorage.getItem('debug松_crew_dist')||'大安區';dist.onchange()}).catch(e=>toast('資料載入失敗：'+e.message));
</script></body></html>
