<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>清潔隊｜清運路線</title><link rel="stylesheet" href="vendor/leaflet/leaflet.css"><link rel="stylesheet" href="common.css"></head>
<body><div class="app"><header></header><main>
<div id="map"></div>
<aside class="panel"><button class="handle" aria-label="展開面板"></button>
 <h2>清運路線</h2><p class="sub">依垃圾桶填充度產生今日清運順序。填充度為模擬值，行人「滿了」回報與清潔隊回報會覆蓋。</p>
 <select id="dist"></select>
 <div style="margin:16px 0 6px" class="row"><span style="flex:1">清運門檻：填充度 ≥ <b id="thV">70</b>%</span><span class="sub" style="margin:0" id="cnt"></span></div>
 <input type="range" id="th" min="10" max="100" step="5" value="70">
 <div class="row" style="margin:12px 0"><label class="ck"><input type="radio" name="st" value="center" checked> 從行政區中心出發</label><label class="ck"><input type="radio" name="st" value="gps"> 從目前位置</label></div>
 <button class="btn pri block" id="gen">產生清運路線</button>
 <div id="sum"></div><div id="stops"></div>
 <h3>回報紀錄</h3><div id="hist" class="sub">尚無紀錄</div>
 <div class="row" style="margin-top:8px"><button class="btn sm" id="reset">清除示範資料</button></div>
 <div class="foot">距離以直線距離計算（最近鄰 + 2-opt 最佳化），時間以車速 20 km/h、每站停留 2 分鐘估算。</div>
</aside></main></div>
<script src="vendor/leaflet/leaflet.js"></script><script src="config.js"></script><script src="common.js"></script>
<script>
nav("crew.html");sheet();
const map=baseMap(TPE_MAIN,14),LS_UI='debug松_crew_ui';
let bins=[],dists={},route=[],start=null;
const binL=L.layerGroup().addTo(map),rtL=L.layerGroup().addTo(map),LV=[['空',0],['1/4',25],['1/2',50],['3/4',75],['滿',100]];
const ui=JSON.parse(localStorage.getItem(LS_UI)||'{}');
function saveUI(){localStorage.setItem(LS_UI,JSON.stringify({dist:dist.value,th:+th.value,route:route.map(f=>f.properties.id),start}))}
const inD=()=>bins.filter(f=>f.properties.district===dist.value);
function drawBins(){binL.clearLayers();const ev=getEvents(),ids=new Set(route.map(f=>f.properties.id));let n=0;
  for(const f of inD()){const v=fillOf(f.properties.id,ev);if(v>=+th.value)n++;
    L.circleMarker(ll(f),{radius:ids.has(f.properties.id)?8:6,color:'#fff',weight:2,fillColor:fillColor(v),fillOpacity:.95}).bindPopup(`<b>${f.properties.address}</b><br>填充度 ${v}%`).addTo(binL)}
  cnt.textContent=`${inD().length} 個垃圾桶・${n} 個達門檻`}
function tour(st,pts){ // 最近鄰 + 2-opt（開放路徑，起點固定）
  const P=[st,...pts.map(ll)],D=(i,j)=>hav(P[i][0],P[i][1],P[j][0],P[j][1]);
  let ord=[0],left=new Set(pts.map((_,i)=>i+1));
  while(left.size){const c=ord[ord.length-1];let b=null,bd=1e18;for(const j of left){const d=D(c,j);if(d<bd){bd=d;b=j}}ord.push(b);left.delete(b)}
  let imp=true,it=0;while(imp&&it++<200){imp=false;for(let i=1;i<ord.length-1;i++)for(let k=i+1;k<ord.length;k++){
    const a=ord[i-1],b=ord[i],c=ord[k],d=ord[k+1];const old=D(a,b)+(d!==undefined?D(c,d):0),nw=D(a,c)+(d!==undefined?D(b,d):0);
    if(nw<old-0.01){ord=[...ord.slice(0,i),...ord.slice(i,k+1).reverse(),...ord.slice(k+1)];imp=true}}}
  let tot=0;for(let i=1;i<ord.length;i++)tot+=D(ord[i-1],ord[i]);
  return{ord:ord.slice(1).map(i=>pts[i-1]),tot}}
function center(){return dists[dist.value]}
async function genRoute(){
  let st=center();
  if(document.querySelector('[name=st]:checked').value==='gps'){st=await new Promise(r=>{let d=false;setTimeout(()=>{if(!d){d=true;toast('無法定位，改用行政區中心');r(center())}},5000);navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{if(!d){d=true;r([p.coords.latitude,p.coords.longitude])}},()=>{if(!d){d=true;toast('未允許定位，改用行政區中心');r(center())}},{timeout:4500}):r(center())})}
  const ev=getEvents(),pick=inD().filter(f=>fillOf(f.properties.id,ev)>=+th.value);
  if(!pick.length){route=[];start=null;saveUI();show();toast('沒有達門檻的垃圾桶');return}
  start=st;route=tour(st,pick).ord;saveUI();show(true)}
function show(fit){
  rtL.clearLayers();drawBins();const ev=getEvents();
  if(!route.length){sum.innerHTML='';stops.innerHTML='';renderHist();return}
  const path=[start,...route.map(ll)];let tot=0;for(let i=1;i<path.length;i++)tot+=hav(...path[i-1],...path[i]);
  L.polyline(path,{color:'#0f9d76',weight:4,opacity:.85}).addTo(rtL);
  L.marker(start,{icon:L.divIcon({className:'me'})}).bindPopup('出發點').addTo(rtL);
  route.forEach((f,i)=>L.marker(ll(f),{icon:L.divIcon({className:'mk',html:i+1,iconSize:[26,26]})}).addTo(rtL));
  const wp=route.slice(0,9).map(f=>ll(f).join(',')),dest=wp.pop();
  const gurl=`https://www.google.com/maps/dir/?api=1&origin=${start.join(',')}&destination=${dest}&waypoints=${encodeURIComponent(wp.join('|'))}&travelmode=driving`;
  sum.innerHTML=`<div class="stats" style="margin:16px 0 10px"><div class="stat"><b>${route.length}</b><span>站</span></div><div class="stat"><b>${(tot/1000).toFixed(1)} km</b><span>約 ${Math.round(tot/1000/20*60+route.length*2)} 分鐘</span></div></div>
   <a class="btn sm block" target="_blank" rel="noopener" href="${gurl}">在 Google Maps 開啟${route.length>9?'（前 9 站）':''}</a>`;
  stops.innerHTML='<h3>清運順序</h3>'+route.map((f,i)=>{const p=f.properties,v=fillOf(p.id,ev);return `<div class="card"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="num">${i+1}</span><div style="flex:1">
   <div class="t" style="font-weight:600">${p.address}</div><div class="sub" style="margin:4px 0 8px">目前 ${fillPill(v)}</div>
   <div class="row">${LV.map(l=>`<button class="btn sm" data-lv="${l[1]}" data-id="${p.id}">${l[0]}</button>`).join('')}<button class="btn sm pri" data-clear="${p.id}">已清運</button></div></div></div></div>`}).join('');
  if(fit)map.fitBounds(path,{padding:[40,40]});renderHist()}
function renderHist(){const ids=new Set(inD().map(f=>f.properties.id)),ev=getEvents().filter(e=>ids.has(e.bin)).reverse().slice(0,30);
  hist.innerHTML=ev.length?ev.map(e=>{const b=bins.find(f=>f.properties.id===e.bin);return `<div style="padding:6px 0;border-bottom:1px solid var(--line)">${timeStr(e.ts)}・<b>${e.by}</b> ${e.kind==='full'?'回報已滿':e.kind==='clear'?'已清運':'回報 '+e.level+'%'}<br>${b?b.properties.address:e.bin}</div>`}).join(''):'尚無紀錄'}
stops.onclick=e=>{const lv=e.target.closest('[data-lv]'),cl=e.target.closest('[data-clear]');
  if(lv){addEvent({bin:lv.dataset.id,kind:'level',level:+lv.dataset.lv,by:'清潔隊'});toast('已回報垃圾量 '+lv.textContent);show()}
  if(cl){addEvent({bin:cl.dataset.clear,kind:'clear',level:0,by:'清潔隊'});toast('已清運，填充度歸零');show()}};
th.oninput=()=>{thV.textContent=th.value;drawBins()};th.onchange=saveUI;
dist.onchange=()=>{route=[];start=null;saveUI();map.setView(center(),14);show()};
document.getElementById("gen").onclick=genRoute;
reset.onclick=()=>{if(confirm('清除所有示範回報與路線？')){localStorage.removeItem(LS_EVENTS);route=[];start=null;saveUI();show();toast('已清除')}};
Promise.all([loadJSON('bins.geojson'),loadJSON('districts.geojson')]).then(([b,d])=>{bins=b.features;
  for(const f of d.features){const c=L.geoJSON(f).getBounds().getCenter();dists[f.properties.name]=[c.lat,c.lng]}
  const names=Object.keys(dists).sort((a,b)=>bins.filter(f=>f.properties.district===b).length-bins.filter(f=>f.properties.district===a).length);
  dist.innerHTML=names.map(n=>`<option value="${n}">${n}（${bins.filter(f=>f.properties.district===n).length} 個）</option>`).join('');
  L.geoJSON(d,{style:{color:'#0f9d76',weight:1,fillOpacity:0,dashArray:'3'},interactive:false}).addTo(map);
  dist.value=ui.dist&&dists[ui.dist]?ui.dist:'中正區';th.value=ui.th||70;thV.textContent=th.value;
  if(ui.route){route=ui.route.map(id=>bins.find(f=>f.properties.id===id)).filter(Boolean);start=ui.start}
  map.setView(center(),14);show(route.length>0)}).catch(e=>toast('資料載入失敗：'+e.message));
</script></body></html>
