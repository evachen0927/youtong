<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>行人｜找最近的垃圾桶</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="common.css"></head>
<body><div class="app"><header></header><main>
<div id="map"></div><div class="hint">點地圖可手動設定位置</div>
<aside class="panel"><button class="handle" aria-label="展開面板"></button>
 <h2>最近的垃圾桶</h2><p class="sub" id="where">定位中…</p>
 <div class="row" style="margin-bottom:14px"><button class="btn sm" id="locate">📍 重新定位</button><button class="btn sm" id="station">🚉 台北車站</button></div>
 <div id="list"></div>
 <h3>圖層</h3>
 <label class="ck"><input type="checkbox" id="lyYb"> 🚲 YouBike 站點（附近）</label>
 <label class="ck"><input type="checkbox" id="lyBus"> 🚌 公車站（附近）</label>
 <div class="foot">距離為直線距離，步行時間以 ×1.3 繞行係數、每分鐘 80 公尺估算。<br>資料：臺北市資料大平臺 行人專用清潔箱（含景點商圈 130 點）、YouBike2.0、臺北市公車站位。</div>
</aside></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="common.js"></script>
<script>
nav('index.html');sheet();
const map=baseMap(TPE_MAIN,16);
let bins=[],yb=[],bus=[],me=null,pos=null,sel=null;
const nearL=L.layerGroup().addTo(map),binL=L.layerGroup().addTo(map),ybL=L.layerGroup(),busL=L.layerGroup();
const ren=L.canvas({padding:.3});
function drawBins(){binL.clearLayers();const b=map.getBounds().pad(.3);for(const f of bins){const p=ll(f);if(b.contains(p))L.circleMarker(p,{renderer:ren,radius:5,color:'#fff',weight:1.5,fillColor:'#5b6670',fillOpacity:.9}).on('click',()=>focusBin(f)).addTo(binL)}}
function drawPts(layer,data,color,on,pop){layer.clearLayers();if(!on||map.getZoom()<14)return;const b=map.getBounds().pad(.2);for(const f of data){const p=ll(f);if(b.contains(p))L.circleMarker(p,{renderer:ren,radius:4,color:'#fff',weight:1,fillColor:color,fillOpacity:.9}).bindPopup(pop(f)).addTo(layer)}}
function redraw(){drawBins();drawPts(ybL,yb,'#f5a623',lyYb.checked,f=>`🚲 <b>${f.properties.name}</b><br>可借 ${f.properties.rent??'-'}・可還 ${f.properties.ret??'-'}`);drawPts(busL,bus,'#2a7de1',lyBus.checked,f=>`🚌 <b>${f.properties.name}</b><br>${f.properties.routes} 條路線停靠`)}
map.on('moveend',redraw);
lyYb.onchange=()=>{lyYb.checked?ybL.addTo(map):ybL.remove();redraw()};lyBus.onchange=()=>{lyBus.checked?busL.addTo(map):busL.remove();redraw()};
function setPos(p,label){pos=p;if(me)me.remove();me=L.marker(p,{icon:L.divIcon({className:'me'}),zIndexOffset:1000}).addTo(map);where.textContent=label;render(true)}
function render(fit){
  const ev=getEvents();
  const top=bins.map(f=>({f,d:hav(pos[0],pos[1],...ll(f))})).sort((a,b)=>a.d-b.d).slice(0,5);
  nearL.clearLayers();
  top.forEach((t,i)=>{L.marker(ll(t.f),{icon:L.divIcon({className:'mk',html:i+1,iconSize:[26,26]}),zIndexOffset:500}).on('click',()=>focusBin(t.f)).addTo(nearL)});
  list.innerHTML=top.map((t,i)=>{const p=t.f.properties,f=fillOf(p.id,ev),[la,lo]=ll(t.f);return `<div class="card item ${sel===p.id?'on':''}" data-id="${p.id}">
   <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="num">${i+1}</span><div style="flex:1"><div class="t">${p.address}</div>
   <div class="m">${p.district}・${fmtM(t.d)}・步行約 ${walkMin(t.d)} 分${p.count>1?'・'+p.count+' 個桶':''}</div>
   <div class="m">目前估計 ${fillPill(f)} ${p.source.includes('scenic')?'<span class="pill">景點商圈</span>':''}</div></div></div>
   ${sel===p.id?`<div class="row" style="margin-top:12px"><a class="btn sm pri" target="_blank" rel="noopener" href="${gmapWalk(la,lo)}">Google Maps 導航</a><button class="btn sm" data-full="${p.id}">回報：這個垃圾桶滿了</button></div>`:''}</div>`}).join('');
  if(fit)map.fitBounds([pos,...top.slice(0,3).map(t=>ll(t.f))],{padding:[50,50],maxZoom:17});
}
function focusBin(f){sel=f.properties.id;map.setView(ll(f),Math.max(map.getZoom(),17));render(false);const c=list.querySelector(`[data-id="${sel}"]`);if(c){c.scrollIntoView({block:'nearest',behavior:'smooth'})}else toast(f.properties.address+'（不在最近 5 個內）')}
list.onclick=e=>{const fb=e.target.closest('[data-full]');if(fb){addEvent({bin:fb.dataset.full,kind:'full',level:100,by:'行人'});toast('已回報，清潔隊頁面會看到 🙏');render(false);return}
  if(e.target.closest('a'))return;const c=e.target.closest('.card');if(c){const f=bins.find(b=>b.properties.id===c.dataset.id);sel=c.dataset.id;map.setView(ll(f),17);render(false)}};
map.on('click',e=>{sel=null;setPos([e.latlng.lat,e.latlng.lng],'手動設定的位置')});
function locate(){where.textContent='定位中…';let done=false;const once=(p,l)=>{if(!done){done=true;setPos(p,l)}};
  setTimeout(()=>once(TPE_MAIN,'無法取得定位，已改用台北車站'),6000);
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>once([p.coords.latitude,p.coords.longitude],'你的目前位置'),()=>once(TPE_MAIN,'未允許定位，已改用台北車站'),{timeout:5000,enableHighAccuracy:true});else once(TPE_MAIN,'瀏覽器不支援定位，已改用台北車站')}
document.getElementById('locate').onclick=locate;station.onclick=()=>setPos(TPE_MAIN,'台北車站');
Promise.all(['bins.geojson','youbike.geojson','busstops.geojson'].map(loadJSON)).then(([b,y,s])=>{bins=b.features;yb=y.features;bus=s.features;redraw();locate()}).catch(e=>where.textContent='資料載入失敗：'+e.message);
</script></body></html>
